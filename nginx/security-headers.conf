# Applied on every response, including redirects and 404s (`always`).
# Top-level links to https://wa.me are navigations; navigate-to is not set, so they stay allowed.
# script-src / connect-src gain the analytics origin at container start when
# NEXT_PUBLIC_ANALYTICS_SRC is set (docker/40-analytics-csp.sh).
# Cloudflare injects its Web Analytics beacon in front of this origin, so that
# host is always allowed: script from static.cloudflareinsights.com, beacons to cloudflareinsights.com.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://wa.me; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; media-src 'self'; manifest-src 'self'" always;
