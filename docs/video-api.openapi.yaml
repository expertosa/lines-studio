openapi: 3.0.3
info:
  title: Lines video API
  version: 0.2.0
  description: |
    Server-to-server short-video jobs for Experto apps. Mobile clients call their own backend.
    The backend holds the bearer key. MoneyPrinterTurbo is reached only by the Mac pull worker.
servers:
  - url: https://api.lines.studio
    description: Production
tags:
  - name: meta
  - name: jobs
  - name: worker
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      tags: [meta]
      security: []
      summary: Process health
      responses:
        "200":
          description: The process is up. ok stays true when no worker is connected. moneyprinter.ready is true only after a moneyprinter worker claims or heartbeats within twice the lease. moneyprinter.worker is online or offline.
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, defaultEngine, engines]
                properties:
                  ok: { type: boolean }
                  service: { type: string, example: lines-video-api }
                  defaultEngine: { type: string, enum: [moneyprinter, template] }
                  engines:
                    type: object
                    additionalProperties: true
  /v1/styles:
    get:
      tags: [meta]
      summary: Styles, formats, durations, and voices
      responses:
        "200":
          description: Catalog for the enabled engines
          content:
            application/json:
              schema:
                type: object
                properties:
                  styles:
                    type: array
                    items: { $ref: "#/components/schemas/Style" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/quote:
    get:
      tags: [meta]
      summary: Price quote
      parameters:
        - $ref: "#/components/parameters/seconds"
        - $ref: "#/components/parameters/style"
        - name: format
          in: query
          schema: { $ref: "#/components/schemas/Format" }
        - name: language
          in: query
          schema: { $ref: "#/components/schemas/Language" }
        - name: tier
          in: query
          description: Style `localize` only. free | economy | pro (default pro). free rejects swaps > 0.
          schema: { type: string, enum: [free, economy, pro] }
        - name: swaps
          in: query
          description: Style `localize` only. Number of swaps, 0–30 (default 1).
          schema: { type: integer, minimum: 0, maximum: 30 }
        - name: dub
          in: query
          description: Style `localize` only. Dub with lip-sync (default true; always true on free).
          schema: { type: string, enum: ["1", "0", "true", "false"] }
      responses:
        "200":
          description: Included in the Experto plan until a paid engine is configured. Style `localize` adds `tier`, `tierInfo` and a USD `cost` estimate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/jobs:
    post:
      tags: [jobs]
      summary: Queue a video
      parameters:
        - $ref: "#/components/parameters/idempotency"
        - $ref: "#/components/parameters/endUser"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobCreate" }
      responses:
        "202":
          description: Queued, or an idempotent replay. Replay sets Idempotency-Replayed true and returns the current status.
          headers:
            Idempotency-Replayed:
              schema: { type: string }
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    get:
      tags: [jobs]
      summary: List jobs for the caller's tenant
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/Status" }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                required: [jobs, nextCursor]
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
                  nextCursor:
                    type: string
                    nullable: true
  /v1/jobs/{id}:
    get:
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/endUser"
      responses:
        "200":
          description: Job. Unknown ids and other tenants are both 404.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/jobs/{id}/cancel:
    post:
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Cancelled, or cancel requested while running
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { $ref: "#/components/schemas/Status" }
                  cancelRequested: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/jobs/{id}/artifacts/{artifactId}:
    get:
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/id"
        - name: artifactId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: exp
          in: query
          description: Unix seconds. With sig, the bearer is not required.
          schema: { type: string }
        - name: sig
          in: query
          description: Hex HMAC. This is not an API key.
          schema: { type: string }
        - name: Range
          in: header
          schema: { type: string, example: bytes=0-1023 }
      responses:
        "200":
          description: Full object
          headers:
            Accept-Ranges: { schema: { type: string } }
            X-Content-SHA256: { schema: { type: string } }
          content:
            video/mp4: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        "206":
          description: Range
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "416":
          description: Range not satisfiable
  /v1/usage:
    get:
      tags: [jobs]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Counts and remaining quota
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
  /v1/worker/claim:
    post:
      tags: [worker]
      summary: Lease the oldest queued job this worker's engines can render
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: A job, or job null when the queue or the concurrency cap is idle
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    oneOf:
                      - { $ref: "#/components/schemas/WorkerJob" }
                      - { type: "null" }
                  leaseExpiresAt: { type: string, format: date-time }
  /v1/worker/jobs/{id}/heartbeat:
    post:
      tags: [worker]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Lease extended
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelRequested: { type: boolean }
                  leaseExpiresAt: { type: string, format: date-time }
        "409": { $ref: "#/components/responses/Error" }
  /v1/worker/jobs/{id}/artifacts:
    post:
      tags: [worker]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                video: { type: string, format: binary }
                thumbnail: { type: string, format: binary }
      responses:
        "201":
          description: Stored
        "409": { $ref: "#/components/responses/Error" }
  /v1/worker/jobs/{id}/complete:
    post:
      tags: [worker]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: succeeded, or cancelled if a cancel was requested
        "409": { $ref: "#/components/responses/Error" }
  /v1/worker/jobs/{id}/fail:
    post:
      tags: [worker]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                message: { type: string }
                retry: { type: boolean }
      responses:
        "200":
          description: failed, requeued, or cancelled
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    endUser:
      name: X-End-User-Id
      in: header
      required: false
      schema: { type: string }
    seconds:
      name: seconds
      in: query
      required: true
      schema: { type: integer, enum: [15, 30, 60] }
    style:
      name: style
      in: query
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        code: { type: string }
  schemas:
    Format:
      type: string
      enum: ["9:16", "16:9", "1:1"]
    Language:
      type: string
      enum: [ar, en]
    Status:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    JobCreate:
      type: object
      additionalProperties: false
      required: [reference, title, style, format, language, seconds]
      properties:
        reference: { type: string }
        title: { type: string }
        prompt: { type: string }
        script:
          type: object
          properties:
            text: { type: string }
            scenes:
              type: array
              items:
                type: object
                required: [text]
                properties:
                  text: { type: string }
                  seconds: { type: integer }
        style: { type: string, example: promo }
        format: { $ref: "#/components/schemas/Format" }
        language: { $ref: "#/components/schemas/Language" }
        seconds: { type: integer, enum: [15, 30, 60] }
        voice: { type: string, example: ar-SA-HamedNeural }
        callbackUrl: { type: string, format: uri }
        metadata:
          type: object
          additionalProperties: true
        localize: { $ref: "#/components/schemas/Localize" }
    Localize:
      type: object
      additionalProperties: false
      description: >-
        Required for style `localize` (listed only when LINES_ENABLE_LOCALIZE=1), rejected for other styles.
        Needs at least one of swaps, captions, dub. A character swap or a dub needs consent.likeness=true.
        `tier` picks the pipeline (default `pro`). pro: Runway Aleph 2.0 swaps + HeyGen Precision (`Arabic (Saudi Arabia)`) dub with lip-sync, about $9.15 per 30 s.
        economy: Gemini Omni 1.2 Flash video edit at 720p for swaps ($0.07/s, the ad is cut into clips of 3–15 s, at most two referenceUrl images), then local Saudi voice + MuseTalk lip-sync on the Mac, about $2.10 per 30 s.
        free: $0 on the Mac only, local Saudi voice + MuseTalk lip-sync; swaps are rejected (`tier_unsupported`) and dub is required.
        free and economy dubs speak captions.text as given (no machine translation), so it is required when dub is true. No tier adds a watermark.
        Jobs include a duration-based cost estimate and are refused when they exceed LINES_LOCALIZE_MAX_USD (default 15). Missing keys or local tools fail with `engine_not_configured`.
      required: [source]
      properties:
        tier: { type: string, enum: [free, economy, pro], default: pro }
        source:
          type: object
          required: [url]
          properties:
            url: { type: string, format: uri, description: "Public https link to the source ad (MP4)" }
        swaps:
          type: array
          maxItems: 30
          items:
            type: object
            required: [kind]
            description: Needs preset, target or referenceUrl.
            properties:
              kind: { type: string, enum: [character, outfit, product, background] }
              preset:
                type: string
                description: >-
                  character: saudi-man, saudi-woman, saudi-family, saudi-youth.
                  outfit: thobe-shemagh, thobe-ghutra, abaya, saudi-casual, saudi-sport.
                  background: riyadh-boulevard, riyadh-kafd, jeddah-corniche, alula, abha, saudi-home-majlis, saudi-cafe.
              target: { type: string, maxLength: 200 }
              referenceUrl: { type: string, format: uri, description: "Public https reference image" }
        captions:
          type: object
          required: [dialect]
          properties:
            dialect: { type: string, enum: [najdi, hijazi, janoubi, sharqawi, white] }
            text: { type: string, maxLength: 2000 }
        dub: { type: boolean, description: "Saudi-dialect voice-over; needs captions.dialect" }
        consent:
          type: object
          properties:
            likeness: { type: boolean, description: "Caller holds the rights to change people and voices in this ad" }
    JobAccepted:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/Status" }
    Job:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        style: { type: string }
        format: { $ref: "#/components/schemas/Format" }
        language: { $ref: "#/components/schemas/Language" }
        seconds: { type: integer }
        voice: { type: string }
        engine: { type: string, enum: [moneyprinter, template, external, blender, ugc, localize] }
        endUserId: { type: string, nullable: true }
        prompt: { type: string, nullable: true }
        script: { type: object, nullable: true }
        metadata: { type: object }
        callbackUrl: { type: string, nullable: true }
        localize: { $ref: "#/components/schemas/Localize" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deadlineAt: { type: string, format: date-time }
        error:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
    Artifact:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [video, thumbnail] }
        mime: { type: string }
        byteSize: { type: integer }
        sha256: { type: string }
        expiresAt: { type: string, format: date-time }
        downloadPath: { type: string }
        signedUrl: { type: string }
    WorkerJob:
      type: object
      description: Render spec. No callback URL and no webhook secret.
      properties:
        id: { type: string }
        reference: { type: string }
        title: { type: string }
        prompt: { type: string, nullable: true }
        script: { type: object, nullable: true }
        style: { type: string }
        format: { $ref: "#/components/schemas/Format" }
        language: { $ref: "#/components/schemas/Language" }
        seconds: { type: integer }
        voice: { type: string, description: "Edge TTS voice, or \"presenter\" for ugc (the presenter's own voice)" }
        metadata: { type: object, additionalProperties: true, description: "Caller metadata; workers read render options from it (promo3d palette/hero, ugc presenter)" }
        localize: { allOf: [{ $ref: "#/components/schemas/Localize" }], nullable: true }
        engine: { type: string }
        width: { type: integer }
        height: { type: integer }
        attempt: { type: integer }
        deadlineAt: { type: string, format: date-time }
    Quote:
      type: object
      properties:
        style: { type: string }
        seconds: { type: integer }
        format: { $ref: "#/components/schemas/Format" }
        language: { $ref: "#/components/schemas/Language" }
        voice: { type: string }
        engine: { type: string }
        currency: { type: string, example: SAR }
        amount: { type: number, example: 0 }
        includedInPlan: { type: boolean }
        tier: { type: string, enum: [free, economy, pro], description: "localize only" }
        tierInfo:
          type: object
          description: "localize only: usdPer30s, swaps, watermark (always false), runsOn, voice, lipsync, swapEngine, turnaround"
        cost:
          type: object
          description: "localize only: USD estimate (estimateUsd, capUsd, withinCap, durationSupported, breakdown)"
    Usage:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        jobs: { type: integer }
        videoSeconds: { type: integer }
        byStatus: { type: object }
        quota: { type: object }
    Style:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        engine: { type: string }
        formats:
          type: array
          items: { $ref: "#/components/schemas/Format" }
        seconds:
          type: array
          items: { type: integer }
        languages:
          type: array
          items: { $ref: "#/components/schemas/Language" }
        voices: { type: object }
        defaultVoice: { type: object }
