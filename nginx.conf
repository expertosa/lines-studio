# Static site. TLS ends at Cloudflare or Coolify; this process is reached over HTTP.
# Do not 301 every request to https — the proxy's own HTTP call would loop.
# http://lines.studio → https://lines.studio is an edge setting (Cloudflare "Always Use HTTPS").
# www is redirected here, whatever the scheme the browser used.

server {
    listen 80;
    server_name www.lines.studio;
    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;
    return 301 https://lines.studio$request_uri;
}

server {
    listen 80 default_server;
    server_name lines.studio _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    location = / {
        return 308 /ar/;
    }

    location ^~ /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|avif)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location ~* \.(?:mp4|webm)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 =404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
}
