# Static site. TLS ends at Cloudflare or Coolify; this process is reached over HTTP.
# Do not 301 every request to https — the proxy's own HTTP call would loop.
# http://lines.studio → https://lines.studio is an edge setting (Cloudflare "Always Use HTTPS").
# www is redirected here, whatever the scheme the browser used.

server {
    listen 80;
    server_name www.lines.studio;
    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;
    return 301 https://lines.studio$request_uri;
}

server {
    listen 80 default_server;
    server_name lines.studio _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # Text only. video/mp4, video/webm and any other media stay off this list:
    # gzip disables byte ranges, and Safari will not play a video that is not a 206.
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/xml+rss image/svg+xml;

    location = / {
        return 308 /ar/;
    }

    location ^~ /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|avif)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Safari refuses <video> unless Range is a real 206 and the body is not gzip.
    location ~* \.mp4$ {
        include /etc/nginx/snippets/security-headers.conf;
        gzip off;
        types { }
        default_type video/mp4;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=2592000, no-transform" always;
        try_files $uri =404;
    }

    location ~* \.webm$ {
        include /etc/nginx/snippets/security-headers.conf;
        gzip off;
        types { }
        default_type video/webm;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=2592000, no-transform" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 =404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
}
